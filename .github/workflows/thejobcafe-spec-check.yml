name: TheJobCafe API spec check

on:
  push:
    paths:
      - '.github/workflows/thejobcafe-spec-check.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public API authentication metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://thejobcafe.com/api/public/openapi.json -o /tmp/openapi.json
          python - <<'PY'
          import json
          spec=json.load(open('/tmp/openapi.json'))
          print('TITLE:', spec.get('info',{}).get('title'))
          print('VERSION:', spec.get('info',{}).get('version'))
          print('\nSECURITY SCHEMES:')
          print(json.dumps(spec.get('components',{}).get('securitySchemes',{}), indent=2))
          for path in ['/api/public/agent-keys/register','/api/public/claims','/api/public/claims/{id}/proof','/api/public/claims/{id}']:
              print('\nPATH', path)
              for method, op in spec['paths'][path].items():
                  if method.lower() in {'get','post'}:
                      print(method.upper(), 'security=', json.dumps(op.get('security')))
                      print('parameters=', json.dumps(op.get('parameters',[]), indent=2))
          PY
